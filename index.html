              {/* بطاقة تقدم الباقة -15% */}
              <div className="lg:col-span-5 bg-white rounded-3xl p-6 shadow-xl border-2 border-[#F4C2C2]">
                <h2 className="text-lg font-extrabold text-[#4A353B]">{t.packTitle}</h2>
                <p className="text-xs text-[#9E7B84] mt-1">{t.packSub}</p>
                <div className="my-4 bg-[#FFF9FA] p-4 rounded-2xl border border-[#F4C2C2]/60">
                  <div className="flex justify-between text-xs font-extrabold mb-2">
                    <span>{totalItems} / 3 {t.packSelected}</span>
                    <span className={hasDiscount ? "text-emerald-600" : "text-[#C86D80]"}>
                      {hasDiscount ? t.packUnlocked : "-15%"}
                    </span>
                  </div>
                  <div className="w-full h-3 bg-[#FADADD]/60 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-500 rounded-full ${hasDiscount ? "bg-emerald-500" : "bg-[#D98899]"}`}
                      style={{ width: `${Math.min((totalItems / 3) * 100, 100)}%` }}
                    />
                  </div>
                </div>
                <button
                  onClick={() => setCartOpen(true)}
                  className="w-full py-3 rounded-xl bg-[#FFF0F3] hover:bg-[#FADADD] text-[#7A3E4D] font-extrabold text-xs transition"
                >
                  🛍️ {t.cart} ({totalItems})
                </button>
              </div>
            </div>
          </section>

          {/* 4. الفلترة المزدوجة */}
          <section className="max-w-7xl mx-auto px-4 py-6 w-full">
            <div className="bg-white rounded-3xl p-5 border border-[#F4C2C2]/60 space-y-4">
              <div>
                <span className="text-xs font-extrabold text-[#9E7B84] block mb-2">{t.filterNeed}</span>
                <div className="flex flex-wrap gap-2">
                  {t.needs.map((n, i) => (
                    <button
                      key={i}
                      onClick={() => setNeedIdx(i)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${needIdx === i ? "bg-[#F4C2C2] text-[#4A353B]" : "bg-[#FFF9FA] text-[#7A5861] border border-[#F4C2C2]/40"}`}
                    >
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="text-xs font-extrabold text-[#9E7B84] block mb-2">{t.filterSeries}</span>
                <div className="flex flex-wrap gap-2">
                  {t.series.map((s, i) => (
                    <button
                      key={i}
                      onClick={() => setSeriesIdx(i)}
                      className={`px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition ${seriesIdx === i ? "bg-[#4A353B] text-white" : "bg-[#FFF9FA] text-[#7A5861] border border-[#F4C2C2]/40"}`}
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* 5. شبكة الكتب */}
          <main className="max-w-7xl mx-auto px-4 pb-16 w-full flex-1">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filtered.map(book => {
                const c = book[lang];
                const save = book.oldPrice ? book.oldPrice - book.price : null;
                return (
                  <div key={book.id} className="bg-white rounded-3xl border border-[#F4C2C2]/60 overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col">
                    <div className="relative h-52 bg-[#FFF0F3]">
                      <img src={book.image} alt={c.title} className="w-full h-full object-cover" />
                      <div className="absolute top-3 start-3 flex flex-col gap-1">
                        <span className="px-3 py-1 rounded-full text-[11px] font-extrabold bg-white/95 text-[#4A353B] shadow-sm">{c.badge}</span>
                        {save && <span className="px-3 py-1 rounded-full text-[11px] font-extrabold bg-[#C86D80] text-white shadow-sm">{t.save} {formatDA(save)}</span>}
                      </div>
                      <button onClick={() => setPreview(book)} className="absolute bottom-3 start-3 px-3 py-1 rounded-xl bg-white/95 text-[#4A353B] text-xs font-extrabold shadow-sm">
                        👁️ {t.preview}
                      </button>
                      <span className="absolute bottom-3 end-3 px-2.5 py-1 rounded-lg bg-[#4A353B]/85 text-white text-[11px] font-bold">{c.pages}</span>
                    </div>
                    <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                      <div>
                        <span className="text-xs font-extrabold text-[#C86D80]">{t.needs[book.needIndex]} • {t.series[book.seriesIndex]}</span>
                        <h3 className="font-extrabold text-[#4A353B] text-base mt-1">{c.title}</h3>
                        <p className="text-xs text-[#7A5861] mt-1.5 leading-relaxed">{c.desc}</p>
                      </div>
                      <div className="pt-3 border-t border-[#F4C2C2]/40 flex items-center justify-between">
                        <div>
                          {book.oldPrice && <span className="text-xs text-[#9E7B84] line-through block">{formatDA(book.oldPrice)}</span>}
                          <span className="text-lg font-black text-[#4A353B]">{formatDA(book.price)}</span>
                        </div>
                        <button onClick={() => addToCart(book)} className="px-4 py-2.5 rounded-2xl bg-[#F4C2C2] hover:bg-[#E8A5B2] text-[#4A353B] font-extrabold text-xs transition">
                          + {t.add}
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </main>

          {/* 6. نافذة معاينة الكتاب */}
          {preview && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 border-2 border-[#F4C2C2] space-y-4">
                <div className="flex justify-between items-start">
                  <h3 className="text-lg font-extrabold text-[#4A353B]">{preview[lang].title}</h3>
                  <button onClick={() => setPreview(null)} className="text-sm font-bold px-2.5 py-1 rounded-full bg-[#FFF0F3]">✕</button>
                </div>
                <img src={preview.image} className="w-full h-48 object-cover rounded-2xl" />
                <p className="text-sm text-[#7A5861]">{preview[lang].desc}</p>
                <div className="flex justify-between items-center pt-2">
                  <span className="text-xl font-black">{formatDA(preview.price)}</span>
                  <button onClick={() => {addToCart(preview); setPreview(null);}} className="px-5 py-2.5 rounded-2xl bg-[#D98899] text-white font-extrabold text-xs">
                    + {t.add}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 7. السلة الجانبية + استمارة الولاية وواتساب */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/40">
              <div className="w-full max-w-md bg-white h-full p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center pb-4 border-b border-[#F4C2C2]">
                    <h2 className="text-lg font-extrabold">🛍️ {t.cart} ({totalItems})</h2>
                    <button onClick={() => setCartOpen(false)} className="px-3 py-1 rounded-full bg-[#FFF0F3] font-bold">✕</button>
                  </div>

                  {cart.length === 0 ? (
                    <p className="text-center text-sm text-[#9E7B84] py-12">{t.emptyCart}</p>
                  ) : (
                    <div className="mt-4 space-y-3">
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between items-center bg-[#FFF9FA] p-3 rounded-2xl border border-[#F4C2C2]/50">
                          <div>
                            <h4 className="text-xs font-extrabold">{item[lang].title}</h4>
                            <span className="text-xs font-black text-[#C86D80]">{formatDA(item.price)}</span>
                          </div>
                          <div className="flex items-center gap-2">
                            <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded bg-white border border-[#F4C2C2] font-bold">-</button>
                            <span className="text-xs font-extrabold">{item.qty}</span>
                            <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded bg-white border border-[#F4C2C2] font-bold">+</button>
                          </div>
                        </div>
                      ))}

                      {/* استمارة معلومات الزبون والولاية */}
                      <div className="mt-6 pt-4 border-t border-[#F4C2C2] space-y-3">
                        <h3 className="text-sm font-extrabold text-[#4A353B]">{t.formTitle}</h3>
                        <input
                          type="text"
                          placeholder={t.namePh}
                          value={customerName}
                          onChange={e => setCustomerName(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-[#FFF9FA] border border-[#F4C2C2] text-xs"
                        />
                        <input
                          type="tel"
                          placeholder={t.phonePh}
                          value={customerPhone}
                          onChange={e => setCustomerPhone(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-[#FFF9FA] border border-[#F4C2C2] text-xs"
                        />
                        <select
                          value={customerWilaya}
                          onChange={e => setCustomerWilaya(e.target.value)}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-[#FFF9FA] border border-[#F4C2C2] text-xs font-semibold"
                        >
                          <option value="">{t.wilayaPh}</option>
                          {WILAYAS.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>

                        <div className="grid grid-cols-2 gap-2 pt-1">
                          <button
                            type="button"
                            onClick={() => setBookFormat("PDF")}
                            className={`py-2 rounded-xl text-xs font-extrabold border ${bookFormat === "PDF" ? "bg-[#F4C2C2] text-[#4A353B] border-[#D98899]" : "bg-white text-[#7A5861] border-[#F4C2C2]"}`}
                          >
                            {t.formatPdf}
                          </button>
                          <button
                            type="button"
                            onClick={() => setBookFormat("Imprimé / مطبوع")}
                            className={`py-2 rounded-xl text-xs font-extrabold border ${bookFormat !== "PDF" ? "bg-[#F4C2C2] text-[#4A353B] border-[#D98899]" : "bg-white text-[#7A5861] border-[#F4C2C2]"}`}
                          >
                            {t.formatPrint}
                          </button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="pt-4 border-t border-[#F4C2C2] space-y-2">
                    <div className="flex justify-between text-xs">
                      <span>{t.subtotal}</span>
                      <span>{formatDA(subtotal)}</span>
                    </div>
                    {hasDiscount && (
                      <div className="flex justify-between text-xs font-extrabold text-emerald-600">
                        <span>{t.discount}</span>
                        <span>- {formatDA(discount)}</span>
                      </div>
                    )}
                    <div className="flex justify-between text-base font-black pt-2 border-t border-[#F4C2C2]/40">
                      <span>{t.total}</span>
                      <span>{formatDA(finalTotal)}</span>
                    </div>
                    <button
                      onClick={sendToWhatsApp}
                      className="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-lg transition flex items-center justify-center gap-2"
                    >
                      <span>💬 {t.whatsappBtn}</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
